# Builds the marketing site (site/) with the cf CLI on every pull request that touches it,
# checks the build with a dry run, and deploys that same build to sawit.dev on pushes to main.
# site/public/install.sh links to scripts/install.sh, so sawit.dev/install.sh redeploys when the script changes.
# Needs the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts edit, plus Workers Routes and
# DNS edit on the sawit.dev zone). The account comes from site/cloudflare.config.ts.
name: Site

on:
  pull_request:
    paths: ["site/**", "scripts/install.sh", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "scripts/install.sh", ".github/workflows/site.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx cf build
      - run: npx cf deploy --prebuilt --dry-run
      - if: github.event_name == 'push'
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
