# Builds Sawit for each version tag (pushed by .githooks/pre-push) and
# publishes the GitHub Release: the zipped app the in-app updater installs,
# the DMG, and the version's CHANGELOG.md section as notes. Run it by hand
# (workflow_dispatch) to rebuild an existing tag: a release the tag has
# already gets the new zip and DMG in place of its old ones, and keeps its
# notes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: scripts/bundle-macos.sh --zip --dmg
      - name: Release notes
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ { if (on) exit } on' \
            CHANGELOG.md > notes.md
      # Inline rather than a script in the repository: a rebuild checks out the
      # tag's tree, which for an older tag wouldn't have that script.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- target/release/Sawit-*-macos-arm64.zip target/release/Sawit.dmg
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$@"
          else
            gh release create "$TAG" --title "Sawit $TAG" --notes-file notes.md "$@"
          fi
