# Builds PG Desk for each version tag (pushed by .githooks/pre-push) and
# publishes the GitHub Release: the zipped app the in-app updater installs,
# the DMG, and the version's CHANGELOG.md section as notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build app
        run: scripts/bundle-macos.sh --zip --dmg
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ { if (on) exit } on' \
            CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "PG Desk $GITHUB_REF_NAME" \
            --notes-file notes.md \
            target/release/PG-Desk-*-macos-arm64.zip target/release/PG-Desk.dmg
