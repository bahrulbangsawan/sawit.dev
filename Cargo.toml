[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time", "macros", "io-util", "sync"] }
tokio-postgres = "0.7.18"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
