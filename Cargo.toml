[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/mcp"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time", "macros", "io-util", "sync"] }
tokio-postgres = "0.7.18"

# GPUI's dependency tree is large; full debuginfo for it filled the disk
# (17 GB in target/). Keep line tables for our crates only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Left-aligned, compact editor line numbers; see vendor/gpui-base/PGDESK_PATCH.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
