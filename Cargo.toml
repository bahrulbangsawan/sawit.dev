[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/mcp", "crates/board"]
exclude = ["vendor"]

[workspace.package]
# Bumped by .githooks/pre-push (scripts/release.sh) on every push to main.
version = "0.0.7"
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time", "macros", "io-util", "sync", "net"] }
tokio-postgres = "0.7.18"

# FigCraft drives the native canvas (crates/board). One pinned rev for every crate, never a
# branch: bump them together.
figcraft-color = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-doc = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-engine = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-format = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-geom = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-render = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }
figcraft-text = { git = "https://github.com/storytold/figcraft", rev = "0971d096db18aa107c5f3d1f83af4ac7f89ea2c3" }

# GPUI's dependency tree is large; full debuginfo for it filled the disk
# (17 GB in target/). Keep line tables for our crates only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hot CPU paths on every file open and keystroke: at opt-level 0 they are
# ~9x slower (highlighting a 30 KB file took ~0.4 s).
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.markdown]
opt-level = 3

# Hot CPU path: debug renders of the native canvas (FigCraft's renderer and
# text layout, the raster and font crates under them, and the engine that
# drives them). At opt-level 0 they also hold enough unwind tables to pass
# the linker's 16 MiB __eh_frame limit: the app's test binary had 17.3 MiB.
[profile.dev.package.figcraft-render]
opt-level = 3
[profile.dev.package.figcraft-engine]
opt-level = 3
[profile.dev.package.figcraft-text]
opt-level = 3
[profile.dev.package.figcraft-geom]
opt-level = 3
[profile.dev.package.figcraft-doc]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

# Cold paths only (downloading Postgres, TLS/HTTP handshakes, config files,
# decoding an image once when opened): optimise for size. Rendering, editing,
# highlighting, the terminal and the database protocol keep opt-level 3.
[profile.release.package.postgresql_archive]
opt-level = "s"
[profile.release.package.reqwest]
opt-level = "s"
[profile.release.package.hyper]
opt-level = "s"
[profile.release.package.hyper-util]
opt-level = "s"
[profile.release.package.h2]
opt-level = "s"
[profile.release.package.http]
opt-level = "s"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.tokio-rustls]
opt-level = "s"
[profile.release.package.tokio-postgres-rustls]
opt-level = "s"
[profile.release.package.rustls-native-certs]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.exr]
opt-level = "s"
[profile.release.package.tiff]
opt-level = "s"
[profile.release.package.gif]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.zune-inflate]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.half]
opt-level = "s"
[profile.release.package.tar]
opt-level = "s"
[profile.release.package.flate2]
opt-level = "s"
[profile.release.package.lsp-types]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.toml_edit]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"
[profile.release.package.security-framework]
opt-level = "s"
[profile.release.package.objc2-av-foundation]
opt-level = "s"

# Left-aligned, compact editor line numbers; see vendor/gpui-base/SAWIT_PATCH.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
