<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mesurer Fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #1d2433; background: #f6f7f9; }
  header { padding: 24px 40px; background: #1d2433; color: #fff; }
  main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 40px; }
  section { padding: 24px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); min-height: 160px; }
  h2 { margin: 0 0 12px; font-size: 22px; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: #3b5bdb; color: #fff; font: inherit; }
</style>
</head>
<body>
<header><h1 id="title">Mesurer fixture</h1></header>
<main>
  <section id="one"><h2>Plans</h2><p>Three plans, billed monthly.</p><button>Choose</button></section>
  <section id="two"><h2>Features</h2><p>Everything a small team needs.</p></section>
  <section id="three"><h2>Support</h2><p>Write to us any time.</p></section>
</main>
<script>
  // Where the pointer last was, in the page's own coordinates: the spec reads it back to learn
  // where the page is on the screen.
  addEventListener("pointermove", (e) => { window.__pointer = [e.clientX, e.clientY]; }, true);
</script>
</body>
</html>
