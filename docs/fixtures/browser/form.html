<!doctype html>
<!-- Fixture for the browser tab's end-to-end check (docs/superpowers/plans/2026-10-29-browser-pane.md). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign up · fixture</title>
    <style>
      body { font: 15px system-ui; margin: 40px; }
      label { display: block; margin: 12px 0 4px; }
      #toast { margin-top: 16px; color: green; }
      .overlay { position: fixed; inset: 0; background: #0006; display: none; }
    </style>
  </head>
  <body>
    <nav><a href="#pricing">Pricing</a> <a href="#docs">Docs</a></nav>
    <h1>Create your account</h1>
    <form id="signup">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required />
      <label for="plan">Plan</label>
      <select id="plan">
        <option value="free">Free</option>
        <option value="pro">Pro</option>
      </select>
      <label><input type="checkbox" id="terms" /> I accept the terms</label>
      <button type="submit">Sign up</button>
    </form>
    <div id="toast" role="status"></div>
    <div class="overlay" id="overlay"></div>
    <script>
      console.log("fixture loaded");
      document.getElementById("signup").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const plan = document.getElementById("plan").value;
        const terms = document.getElementById("terms").checked;
        console.info("submitting", { email, plan, terms });
        const response = await fetch("/api/signup", { method: "POST", body: JSON.stringify({ email, plan }) });
        if (!response.ok) console.error("signup failed with " + response.status);
        document.getElementById("toast").textContent = "Welcome, " + email + " (" + plan + ")";
      });
    </script>
  </body>
</html>
