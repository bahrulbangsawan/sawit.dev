[package]
name = "sawit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
gpui-kit = { version = "=0.8.1", features = ["syntect"] }
# Same versions/features as gpui-kit's syntect backend; see src/highlight.rs.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# The editors' parser for the languages below (src/highlight/grammars.rs); syntect colors the
# rest. tree-sitter stays on 0.26, the line gpui-component 0.8.1's optional tree-sitter feature
# needs: the crate links its C library, so a project can hold only one version of it.
tree-sitter = "0.26.13"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
# SQL. Its build script asks for cc ~1.2, which holds the whole workspace's cc on 1.2.x.
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
image = { version = "0.25", default-features = false, features = ["png"] }
sawit-core = { path = "../core" }
# `sawit-mcp` is built into this binary; see `invoked_as_mcp` in main.rs.
sawit-mcp = { path = "../mcp" }
# The native canvas (src/board): its document logic, and FigCraft at the rev the workspace pins.
sawit-board = { path = "../board" }
figcraft-doc.workspace = true
figcraft-engine.workspace = true
figcraft-render.workspace = true
figcraft-text.workspace = true
# The debug log (the canvas's render times), printed on stderr only when RUST_LOG is set.
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# In-app video: AVPlayer frames painted through GPUI's surface().
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFString", "CFCGTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue", "NSObject", "NSData"] }
tokio.workspace = true
tokio-postgres.workspace = true
wry = { version = "0.57", default-features = false, features = ["os-webview", "devtools"] }
# Browser tab screenshots (WKWebView takeSnapshot → PNG); same versions as wry's.
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView"] }
block2 = "0.6"
serde_json = "1"
# The arguments of actions bound in the keymap (`board::Command`): GPUI builds them from JSON and
# describes them with a schema.
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
# Headless windows and simulated keystrokes for UI tests.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
# Throwaway config files for the catalog pages' tests.
tempfile = "3"
