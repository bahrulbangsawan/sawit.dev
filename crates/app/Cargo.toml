[package]
name = "sawit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
gpui-kit = { version = "=0.8.1", features = ["syntect"] }
# Same versions/features as gpui-kit's syntect backend; see src/highlight.rs.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false }
sawit-core = { path = "../core" }
# `sawit-mcp` is built into this binary; see `invoked_as_mcp` in main.rs.
sawit-mcp = { path = "../mcp" }
# In-app video: AVPlayer frames painted through GPUI's surface().
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFString", "CFCGTypes"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue", "NSObject"] }
tokio.workspace = true
tokio-postgres.workspace = true
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
include_dir = "0.7"
# The canvas bundle is embedded brotli-compressed (web/canvas/compress.mjs).
brotli-decompressor = "6.2.0"
serde_json = "1"
