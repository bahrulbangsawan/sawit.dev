<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Canvas</title>
		<link rel="stylesheet" href="/canvas.css" />
		<!-- Offline only: scripts, styles, fonts and fetches come from the app
		     (sawitcanvas:) or the page itself (data:, blob:). Only embeds the
		     user adds (YouTube, …) and their images may reach the network. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src sawitcanvas: data: blob:; script-src sawitcanvas: 'unsafe-inline' 'unsafe-eval'; style-src sawitcanvas: 'unsafe-inline'; font-src sawitcanvas: data: blob:; connect-src sawitcanvas: data: blob:; img-src sawitcanvas: data: blob: https:; frame-src https:; worker-src sawitcanvas: blob:"
		/>
		<!-- Fonts load from the app. A full URL: for a custom scheme
		     location.origin is "null", so a bare "/" would make Excalidraw
		     fall back to its CDN. -->
		<script>
			window.EXCALIDRAW_ASSET_PATH = new URL('/', location.href).href
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/canvas.js"></script>
	</body>
</html>
