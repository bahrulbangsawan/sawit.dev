[package]
name = "sawit-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The canvas tools read and edit the stored canvas file themselves while Sawit is closed.
sawit-board = { path = "../board" }
sawit-core = { path = "../core" }
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io"] }
futures.workspace = true
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tokio-postgres.workspace = true
# Runs code mode's scripts (`run`): the QuickJS the app already links for Pele, so no new engine
# in the binary (Boa, measured against it, is in docs/notes/2026-11-07-mcp-audit.md).
rquickjs = "0.14"

[dev-dependencies]
# A client for the code-mode test, talking to the server over an in-memory pipe.
rmcp = { version = "=3.8.0", features = ["client", "transport-async-rw"] }
# A canvas test writes a canvas file holding more images than FigCraft reads from one file.
figcraft-format.workspace = true
tempfile = "3"
# Builds the D1 and SQLite fixture files the database tools are tested on.
rusqlite = "0.41"
