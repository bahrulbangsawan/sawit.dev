[package]
name = "sawit-board"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# file.import takes base64 `data`; FigCraft's own version, already locked.
base64 = "0.22"
# FigCraft is pinned to one rev in the workspace root.
figcraft-color.workspace = true
figcraft-doc.workspace = true
figcraft-engine.workspace = true
figcraft-format.workspace = true
figcraft-geom.workspace = true
figcraft-render.workspace = true
figcraft-text.workspace = true
# Mermaid's SVG as board shapes (mermaid.rs): its geometry and its markup. Both versions are
# already locked; kurbo is FigCraft's own.
kurbo = "0.13"
log = "0.4"
roxmltree = "0.21"
sawit-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
