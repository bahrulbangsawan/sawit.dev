[package]
name = "pgdesk-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
alacritty_terminal = "=0.26.0"
postgresql_archive = { version = "=0.22.0", default-features = false, features = ["theseus", "tls-rustls-ring"] }
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
