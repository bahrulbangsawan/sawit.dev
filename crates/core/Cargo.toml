[package]
name = "sawit-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
# Excel export (crates/core/src/db/export/); already built for postgresql_archive.
crc32fast = "1.5"
# COPY FROM STDIN chunks (tokio-postgres's own byte type).
bytes = "1"
flate2 = "1.1"
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
toml = "0.9"
alacritty_terminal = "=0.26.0"
regex = "1"
postgresql_archive = { version = "=0.22.0", default-features = false, features = ["theseus", "tls-rustls-ring"] }
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
# Runs Pele (Mermaid to SVG, crates/core/assets/pele) offline.
rquickjs = "0.14"
# SQLite files: Cloudflare D1's local databases (Miniflare's .sqlite files) and plain .sqlite
# files. `bundled` builds SQLite itself (public domain), so it never depends on the system's.
rusqlite = { version = "0.41", features = ["bundled"] }
# SHA-256 and HMAC-SHA-256 for Miniflare's Durable Object ids (the D1 file names); already built
# for rustls.
ring = "0.17"
# The browser's favicons and SEO scan (`web`): reqwest is already in the tree (postgresql_archive),
# html5ever and markup5ever_rcdom too (gpui-base), image with these decoders too.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
url = "2"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.46"

[target.'cfg(unix)'.dependencies]
# Asks the PTY which process group is in the foreground.
libc = "0.2"
# Git blob hashes for the GitHub syncs; already in the app through figcraft-format.
sha1 = "0.11"

[dev-dependencies]
tempfile = "3"
