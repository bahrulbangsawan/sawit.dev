[package]
name = "sawit-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
# Excel export (crates/core/src/db/export.rs); already built for postgresql_archive.
crc32fast = "1.5"
# COPY FROM STDIN chunks (tokio-postgres's own byte type).
bytes = "1"
flate2 = "1.1"
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
toml = "0.9"
alacritty_terminal = "=0.26.0"
postgresql_archive = { version = "=0.22.0", default-features = false, features = ["theseus", "tls-rustls-ring"] }
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
# Runs Pele (Mermaid to SVG, crates/core/assets/pele) offline.
rquickjs = "0.14"

[target.'cfg(unix)'.dependencies]
# Asks the PTY which process group is in the foreground.
libc = "0.2"

[dev-dependencies]
# Same version GPUI rasterizes SVG with: proves rendered diagrams parse.
resvg = "0.46"
tempfile = "3"
