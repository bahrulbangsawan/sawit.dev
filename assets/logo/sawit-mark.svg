<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 72 384 384">
  <!-- The Sawit mark without its tile, for use on any background (title
       bar, README). Same geometry as sawit.svg. -->
  <defs>
    <linearGradient id="frond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F8A3E"/>
      <stop offset="1" stop-color="#A6D987"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4503D"/>
      <stop offset="1" stop-color="#EE9A55"/>
    </linearGradient>
    <radialGradient id="fruit" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#F08A4B"/>
      <stop offset="0.6" stop-color="#C8433A"/>
      <stop offset="1" stop-color="#6E1F2A"/>
    </radialGradient>
    <!-- one frond, pointing right from the crown -->
    <g id="leaf">
      <path d="M0 0 C 46 -62, 132 -62, 184 6 C 126 -22, 52 -16, 0 0 Z" fill="url(#frond)"/>
      <path d="M14 -8 C 64 -34, 122 -32, 176 2" fill="none" stroke="#3F7032"
            stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    </g>
    <!-- gap between the fronds and the fruit bunch -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <ellipse cx="256" cy="222" rx="36" ry="32" fill="#000"/>
    </mask>
  </defs>
    <!-- trunk: three database discs, widening toward the root -->
  <g fill="url(#trunk)">
    <path d="M214 268 v32 a42 11 0 0 0 84 0 v-32 Z"/>
    <path d="M207 320 v36 a49 13 0 0 0 98 0 v-36 Z"/>
    <path d="M200 376 v40 a56 15 0 0 0 112 0 v-40 Z"/>
  </g>
  <g fill="#F7C690">
    <ellipse cx="256" cy="268" rx="42" ry="11"/>
    <ellipse cx="256" cy="320" rx="49" ry="13"/>
    <ellipse cx="256" cy="376" rx="56" ry="15"/>
  </g>
  <!-- crown: five fronds -->
  <g mask="url(#gap)">
    <g transform="translate(256 214) scale(0.92)">
      <use href="#leaf" transform="rotate(4) translate(18 0)"/>
      <use href="#leaf" transform="scale(-1 1) rotate(4) translate(18 0)"/>
      <use href="#leaf" transform="rotate(-40) translate(18 0) scale(0.92)"/>
      <use href="#leaf" transform="scale(-1 1) rotate(-40) translate(18 0) scale(0.92)"/>
      <use href="#leaf" transform="rotate(-86) translate(18 0) scale(0.7)"/>
    </g>
  </g>
  <!-- fruit bunch (tandan) -->
  <g fill="url(#fruit)">
    <circle cx="242" cy="206" r="13"/>
    <circle cx="270" cy="206" r="13"/>
    <circle cx="230" cy="228" r="13"/>
    <circle cx="256" cy="226" r="13"/>
    <circle cx="282" cy="228" r="13"/>
    <circle cx="243" cy="246" r="12"/>
    <circle cx="269" cy="246" r="12"/>
  </g>
</svg>
